# Weston configuration for managarm.
#
# Weston's built-in panel does NOT read /usr/share/applications/*.desktop -- it only
# shows launchers declared here. With no weston.ini the panel falls back to a single
# terminal button, which is why the desktop looked empty regardless of installed apps.
#
# Installed to /etc/xdg/weston/weston.ini by the image build (src/rootfs-overlay,
# applied in scripts/update-image.py), so it survives make-image / remake-image.
#
# ICON SIZE MATTERS. Every launcher icon must be ~24px RGBA. 16x16 (icon_window) drew as
# diagonal white streaks and 256x256 RGB scaled to an unreadable blob -- the classic
# stride/pitch-mismatch signature (measured 2026-07-29). The bundled icon_terminal (24x19),
# icon_editor (24x22) and icon_flower (24x24) are fine; the icon_{imageview,htop,vim,clock}
# here are purpose-made 24x24 RGBA shipped alongside this file. If a launcher renders as
# diagonal garbage, check its icon size first.

[core]
# SDDM starts weston as `weston --xwayland`, so X11 clients (xclock...) work. Restated
# here so it also holds if weston is launched directly.
xwayland=true
# Managarm has no working DPMS path here; a blanked screen is easily mistaken for a dead
# display, so never idle out.
idle-time=0

[shell]
locking=false
panel-position=top
background-image=/usr/share/weston/background.png
background-type=scale-crop

# --- Web browser (GNOME Web / epiphany, GTK4+WebKit) -------------------------
[launcher]
displayname=Web browser
icon=/usr/share/weston/icon_webbrowser.png
path=/usr/bin/epiphany

# --- Native Wayland clients (weston's own, known to render here) -------------
[launcher]
displayname=Terminal
icon=/usr/share/weston/icon_terminal.png
path=/usr/bin/weston-terminal

[launcher]
displayname=Editor
icon=/usr/share/weston/icon_editor.png
path=/usr/bin/weston-editor

[launcher]
displayname=Image viewer
icon=/usr/share/weston/icon_imageview.png
path=/usr/bin/weston-image /usr/share/weston/background.png

# weston-flower draws once and stops (established by measurement); a static flower is
# EXPECTED and is not a repaint stall.
[launcher]
displayname=Flower
icon=/usr/share/weston/icon_flower.png
path=/usr/bin/weston-flower

# --- Terminal programs, wrapped so they get a window ------------------------
# weston-terminal --shell=PROGRAM runs PROGRAM instead of the login shell.
[launcher]
displayname=htop
icon=/usr/share/weston/icon_htop.png
path=/usr/bin/weston-terminal --shell=/usr/bin/htop

[launcher]
displayname=vim
icon=/usr/share/weston/icon_vim.png
path=/usr/bin/weston-terminal --shell=/usr/bin/vim

# --- X11 client via Xwayland (also checks the Xwayland path) ----------------
[launcher]
displayname=Clock (Xwayland)
icon=/usr/share/weston/icon_clock.png
path=/usr/bin/xclock

# --- Qt clients (test that Qt/Wayland apps run under weston, not just kwin) --
# Reusing 24px icons; distinct artwork is cosmetic. If these do not open, that is a
# real blocker (Qt platform plugin / theme under a non-kwin compositor).
[launcher]
displayname=Font viewer (Qt)
icon=/usr/share/weston/icon_editor.png
path=/usr/bin/kfontview

[launcher]
displayname=D-Bus viewer (Qt)
icon=/usr/share/weston/icon_imageview.png
path=/usr/bin/qdbusviewer
